<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music Battle</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    margin:0;
    background:#111827;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

.container{
    max-width:500px;
    margin:40px auto;
    background:#1f2937;
    padding:25px;
    border-radius:20px;
}

input,select,button{
    width:90%;
    padding:14px;
    margin:8px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button{
    background:#22c55e;
    color:white;
    cursor:pointer;
}

button:hover{
    opacity:.8;
}

.player{
    background:#374151;
    padding:12px;
    margin:6px;
    border-radius:10px;
}

.score{
    color:#facc15;
}

.room{
    font-size:22px;
    color:#38bdf8;
}

</style>

</head>


<body>


<div class="container">


<h1>?? Music Battle</h1>


<h3>Ваш ник</h3>

<input id="nickname" placeholder="Введите ник">


<h3>VK профиль</h3>

<input id="vk" placeholder="https://vk.com/...">


<select id="tracks">

<option value="10">10 песен</option>
<option value="20">20 песен</option>
<option value="50">50 песен</option>

</select>



<button onclick="createRoom()">
?? Создать комнату
</button>



<hr>


<h3>Вход в комнату</h3>


<input id="roomCode" placeholder="Код комнаты">


<button onclick="joinRoom()">
?? Войти
</button>



<h2 class="room" id="room"></h2>


<h3>Игроки</h3>


<div id="players"></div>



</div>




<script>


// ===============================
// SUPABASE
// ===============================


const SUPABASE_URL =
"https://rtipoyofrixgxsozysng.supabase.co";


const SUPABASE_KEY =
"sb_publishable_um-yGCvtCrApIIfr3qrUvA_iXbsyPhb";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);




// ===============================
// VARIABLES
// ===============================


let roomId=null;
let playerId=null;



// ===============================
// GENERATE ROOM CODE
// ===============================


function generateCode(){

let chars=
"ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


let result="";


for(let i=0;i<6;i++){

result += chars[
Math.floor(
Math.random()*chars.length
)
];

}


return result;

}




// ===============================
// CREATE ROOM
// ===============================


async function createRoom(){


let nickname =
document.getElementById("nickname").value;


let vk =
document.getElementById("vk").value;


let tracks =
document.getElementById("tracks").value;



if(!nickname){

alert("Введите ник");

return;

}



let code =
generateCode();



let {data,error}=await supabaseClient
.from("game_rooms")
.insert({

room_code:code,

vk_profile:vk,

track_count:Number(tracks),

status:"waiting"

})
.select()
.single();



if(error){

alert(error.message);

return;

}



roomId=data.id;



await addPlayer(nickname);



document.getElementById("room").innerHTML=
"?? Комната: "+code;


startRealtime();



}






// ===============================
// JOIN ROOM
// ===============================


async function joinRoom(){


let code =
document.getElementById("roomCode").value;


let nickname =
document.getElementById("nickname").value;



let {data,error}=await supabaseClient
.from("game_rooms")
.select("*")
.eq(
"room_code",
code
)
.single();



if(error){

alert("Комната не найдена");

return;

}



roomId=data.id;


await addPlayer(nickname);


document.getElementById("room").innerHTML=
"?? Комната: "+code;


startRealtime();


}






// ===============================
// ADD PLAYER
// ===============================


async function addPlayer(nickname){



let {data,error}=await supabaseClient
.from("players")
.insert({

room_id:roomId,

nickname:nickname,

score:0

})
.select()
.single();



if(error){

alert(error.message);

return;

}


playerId=data.id;


}






// ===============================
// REALTIME
// ===============================


function startRealtime(){


loadPlayers();



supabaseClient
.channel("room-"+roomId)

.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"players",
filter:
"room_id=eq."+roomId
},
()=>{

loadPlayers();

}

)

.subscribe();


}







async function loadPlayers(){


let {data,error}=await supabaseClient
.from("players")
.select("*")
.eq(
"room_id",
roomId
)
.order(
"score",
{
ascending:false
}
);



if(!data)return;



let html="";



data.forEach(player=>{


html += `

<div class="player">

?? ${player.nickname}

<br>

<span class="score">

?? ${player.score} очков

</span>


</div>

`;


});



document.getElementById("players")
.innerHTML=html;



}




</script>


</body>
</html>
