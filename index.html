<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music Battle</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

min-height:100vh;

background:
radial-gradient(circle at top,#243b55,#101827 60%,#080d16);

color:white;

font-family:Arial,"Segoe UI",sans-serif;

}


.container{

width:min(600px,94%);

margin:30px auto;

padding:25px;

background:rgba(25,34,50,.96);

border-radius:22px;

box-shadow:0 20px 60px rgba(0,0,0,.35);

}


h1{

text-align:center;

color:#38bdf8;

}


h2{

margin-top:10px;

}


input,
select,
button{

width:100%;

padding:14px;

margin:7px 0;

border:0;

border-radius:12px;

font-size:16px;

}


input,
select{

background:#111827;

color:white;

}


button{

background:#22c55e;

color:white;

font-weight:bold;

cursor:pointer;

}


button:hover{

filter:brightness(1.1);

}


.secondary{

background:#334155;

}


.hidden{

display:none!important;

}


.room-code{

text-align:center;

font-size:32px;

font-weight:bold;

letter-spacing:6px;

color:#38bdf8;

}


.status{

background:#172033;

padding:12px;

border-radius:12px;

text-align:center;

margin:10px 0;

}


.player{

display:flex;

justify-content:space-between;

align-items:center;

padding:12px;

margin:7px 0;

background:#273449;

border-radius:12px;

}


.score{

color:#facc15;

}


.error{

color:#f87171;

}


.success{

color:#4ade80;

}


img.avatar{

width:70px;

height:70px;

border-radius:50%;

}


</style>

</head>


<body>


<div class="container">


<h1>
🎵 Music Battle
</h1>



<!-- ================= -->
<!-- SPOTIFY LOGIN -->
<!-- ================= -->


<div id="loginScreen">


<h2>
🎧 Подключение Spotify
</h2>


<button onclick="loginSpotify()">

Войти через Spotify

</button>


<div id="profile"></div>


</div>





<!-- ================= -->
<!-- LOBBY -->
<!-- ================= -->


<div id="lobby" class="hidden">


<input
id="nickname"
placeholder="Ваш ник"
maxlength="32"
>


<select id="trackCount">

<option value="10">
10 песен
</option>


<option value="20">
20 песен
</option>


<option value="50">
50 песен
</option>


</select>



<button onclick="createRoom()">

🚀 Создать комнату

</button>



<hr>



<input
id="roomCodeInput"
placeholder="Код комнаты"
maxlength="6"
>



<button
class="secondary"
onclick="joinRoom()">

🔑 Войти в комнату

</button>



<div id="message"></div>


</div>





<!-- ================= -->
<!-- ROOM -->
<!-- ================= -->


<div id="roomScreen" class="hidden">


<div id="roomCode"
class="room-code">

</div>


<div id="roomStatus"
class="status">

Ожидание игроков

</div>



<button
id="startButton"
class="hidden"
onclick="startGame()">

▶️ Начать игру

</button>



<h3>
👥 Игроки
</h3>


<div id="players"></div>


</div>





<!-- ================= -->
<!-- GAME -->
<!-- ================= -->


<div id="gameScreen" class="hidden">


<div id="roundInfo"
class="status">

Раунд

<span id="round">
1
</span>

/

<span id="total">
10
</span>

</div>


<div id="timer">

15

</div>


<button
class="secondary"
onclick="playPreview()">

▶️ Слушать фрагмент

</button>


<audio id="audio"></audio>


<div id="answers"></div>


<div id="result"></div>


</div>



</div>





<script>


// ===============================
// SUPABASE
// ===============================


const SUPABASE_URL =
"https://rtipoyofrixgxsozysng.supabase.co";


const SUPABASE_KEY =
"sb_publishable_um-yGCvtCrApIIfr3qrUvA_iXbsyPhb";



const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);




// ===============================
// SPOTIFY
// ===============================


const SPOTIFY_CLIENT_ID =
"db9e7ea214924addb0fe4d7bd96cd231";


const SPOTIFY_REDIRECT =
"https://rtipoyofrixgxsozysng.supabase.co/functions/v1/spotify-auth";




// ===============================
// STATE
// ===============================


let user=null;

let roomId=null;

let playerId=null;

let host=false;

let currentSong=null;

let currentRoom=null;

let timer=null;

let timeLeft=15;

let channel=null;



// ===============================
// HELPERS
// ===============================


function $(id){

return document.getElementById(id);

}



function message(text,error=false){

$("message").innerHTML=

`
<div class="${error?"error":"success"}">
${text}
</div>
`;

}



function codeGenerate(){

let chars=
"ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

let c="";

for(let i=0;i<6;i++){

c+=chars[
Math.floor(
Math.random()*chars.length
)
];

}

return c;

}





// ===============================
// SPOTIFY LOGIN
// ===============================


function loginSpotify(){


let scopes=

"user-read-private user-read-email playlist-read-private";



let url=

"https://accounts.spotify.com/authorize?"

+
"client_id="+SPOTIFY_CLIENT_ID

+
"&response_type=code"

+
"&redirect_uri="
+
encodeURIComponent(
SPOTIFY_REDIRECT
)

+
"&scope="
+
encodeURIComponent(
scopes
);



location.href=url;


}




async function checkSpotify(){


let params=
new URLSearchParams(
location.search
);


let code=
params.get("code");


if(!code)return;



let res=
await fetch(
SPOTIFY_REDIRECT+
"?code="+code
);



let data=
await res.json();



if(data.success){


user=data.user;



await db
.from("users")
.upsert({

spotify_id:user.id,

display_name:user.display_name,

avatar_url:
user.images?.[0]?.url

});



$("profile").innerHTML=

`

<img class="avatar"
src="${user.images?.[0]?.url||''}">

<br>

${user.display_name}

<br>

<span class="success">
Spotify подключён ✅
</span>

`;



$("loginScreen")
.classList
.add("hidden");


$("lobby")
.classList
.remove("hidden");


}


}



checkSpotify();

// ===============================
// CREATE ROOM
// ===============================

async function createRoom(){

if(!user){

message(
"Сначала войдите через Spotify",
true
);

return;

}


let nickname =
$("nickname").value.trim();


if(!nickname){

message(
"Введите ник",
true
);

return;

}



let roomCode =
codeGenerate();



let {data:room,error}=

await db
.from("rooms")
.insert({

code:roomCode,

owner_id:null,

track_count:
Number(
$("trackCount").value
),

total_rounds:
Number(
$("trackCount").value
),

current_round:0,

status:"waiting"

})
.select()
.single();



if(error){

console.error(error);

message(
error.message,
true
);

return;

}



roomId=room.id;



// создаём игрока


let {data:player}=

await db
.from("players")
.insert({

room_id:roomId,

user_id:user.id,

nickname:nickname,

score:0

})
.select()
.single();



playerId=player.id;



await db
.from("rooms")
.update({

owner_id:
playerId

})
.eq(
"id",
roomId
);



host=true;


currentRoom=room;



await loadSpotifyTracks();



enterRoom(roomCode);


}





// ===============================
// JOIN ROOM
// ===============================


async function joinRoom(){


let nickname=
$("nickname").value.trim();


let code=
$("roomCodeInput")
.value
.trim()
.toUpperCase();



let {data:room}=

await db
.from("rooms")
.select("*")
.eq(
"code",
code
)
.single();



if(!room){

message(
"Комната не найдена",
true
);

return;

}



roomId=room.id;



let {data:player}=

await db
.from("players")
.insert({

room_id:room.id,

user_id:user.id,

nickname:nickname,

score:0

})
.select()
.single();



playerId=player.id;


currentRoom=room;



enterRoom(code);


}







// ===============================
// ENTER ROOM
// ===============================


function enterRoom(code){


$("lobby")
.classList
.add("hidden");


$("roomScreen")
.classList
.remove("hidden");



$("roomCode")
.textContent=
code;



if(host){

$("startButton")
.classList
.remove("hidden");

}



loadPlayers();


subscribe();


}





// ===============================
// PLAYERS
// ===============================


async function loadPlayers(){


let {data}=

await db
.from("players")
.select("*")
.eq(
"room_id",
roomId
)
.order(
"score",
{
ascending:false
}
);



let html="";


data.forEach(p=>{


html+=`

<div class="player">

<span>
👤 ${p.nickname}
</span>


<span class="score">

${p.score}

</span>

</div>

`;

});



$("players").innerHTML=html;


}





// ===============================
// REALTIME
// ===============================


function subscribe(){


channel=

db.channel(
"room-"+roomId
)


.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"players",
filter:
"room_id=eq."+roomId
},
loadPlayers
)



.on(
"postgres_changes",
{
event:"UPDATE",
schema:"public",
table:"rooms",
filter:
"id=eq."+roomId
},
payload=>{


currentRoom=
payload.new;


if(
payload.new.status==="playing"
){

openGame();

}


}

)


.subscribe();


}






// ===============================
// LOAD SPOTIFY SONGS
// ===============================


async function loadSpotifyTracks(){


/*
Здесь будет следующий модуль:
получение плейлистов Spotify
и сохранение songs

Пока берём уже добавленные песни
*/


let {data:songs}=

await db
.from("songs")
.select("*")
.limit(
Number(
$("trackCount").value
)
);



if(!songs || songs.length===0){

message(
"Добавьте песни в таблицу songs",
true
);

return;

}



for(
let i=0;
i<songs.length;
i++
){


await db
.from("room_tracks")
.insert({

room_id:roomId,

song_id:songs[i].id,

position:i+1

});


}



}







// ===============================
// START GAME
// ===============================


async function startGame(){


if(!host)return;



await db
.from("rooms")
.update({

status:"playing",

current_round:1

})
.eq(
"id",
roomId
);


}





// ===============================
// GAME
// ===============================


async function openGame(){


$("roomScreen")
.classList
.add("hidden");


$("gameScreen")
.classList
.remove("hidden");



loadRound();


}




async function loadRound(){


let {data:room}=

await db
.from("rooms")
.select("*")
.eq(
"id",
roomId
)
.single();



currentRoom=room;



$("round")
.textContent=
room.current_round;



$("total")
.textContent=
room.total_rounds;



let {data}=

await db
.from("room_tracks")
.select(
"songs(*)"
)
.eq(
"room_id",
roomId
)
.eq(
"position",
room.current_round
)
.single();



if(!data)return;



currentSong=
data.songs;



$("audio").src=
currentSong.preview_url;



createAnswers();

startTimer();


}





// ===============================
// ANSWERS
// ===============================


async function createAnswers(){


let {data:songs}=

await db
.from("songs")
.select("*")
.limit(20);



let list=

[songs.find(
s=>s.id===currentSong.id
),
...songs]
.filter(Boolean)
.slice(0,4);



list.sort(
()=>Math.random()-0.5
);



$("answers").innerHTML="";



list.forEach(song=>{


let b=document.createElement("button");


b.className="answer";


b.innerText=

song.artist+
" - "+
song.title;



b.onclick=
()=>answer(song);



$("answers")
.appendChild(b);



});



}




function playPreview(){


$("audio")
.play();


}






// ===============================
// TIMER
// ===============================


function startTimer(){


clearInterval(timer);


timeLeft=15;


$("timer")
.textContent=timeLeft;



timer=setInterval(()=>{


timeLeft--;


$("timer")
.textContent=timeLeft;



if(timeLeft<=0){

clearInterval(timer);

}


},1000);



}





// ===============================
// ANSWER
// ===============================


async function answer(song){



let correct=
song.id===currentSong.id;



await db
.from("answers")
.insert({

room_id:roomId,

player_id:playerId,

answer:song.title,

correct:correct

});



if(correct){


let {data:p}=

await db
.from("players")
.select("score")
.eq(
"id",
playerId
)
.single();



await db
.from("players")
.update({

score:
p.score+100

})
.eq(
"id",
playerId
);



}



$("result")
.innerHTML=

correct
?
"✅ Правильно!"
:
"❌ Неверно";



}





</script>

</body>

</html>
