<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music Battle</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

min-height:100vh;

background:
radial-gradient(circle at top,#243b55,#101827 60%,#080d16);

font-family:
Arial,
Segoe UI,
sans-serif;

color:white;

}


.container{

width:min(650px,95%);

margin:25px auto;

padding:25px;

background:
rgba(25,34,50,.96);

border-radius:22px;

box-shadow:
0 20px 60px rgba(0,0,0,.4);

}



h1{

text-align:center;

color:#38bdf8;

}



input,
button,
select{

width:100%;

padding:14px;

margin:7px 0;

border-radius:12px;

border:0;

font-size:16px;

}



input,
select{

background:#111827;

color:white;

}



button{

background:#22c55e;

color:white;

font-weight:bold;

cursor:pointer;

}


button:hover{

filter:brightness(1.1);

}


.secondary{

background:#334155;

}


.hidden{

display:none!important;

}



.room-code{

text-align:center;

font-size:32px;

letter-spacing:5px;

color:#38bdf8;

font-weight:bold;

}



.player{

background:#273449;

padding:12px;

margin:7px 0;

border-radius:12px;

display:flex;

justify-content:space-between;

}



.score{

color:#facc15;

}



.status{

background:#172033;

padding:12px;

border-radius:10px;

text-align:center;

margin:10px 0;

}



.answers{

display:grid;

grid-template-columns:1fr 1fr;

gap:10px;

}



.answer{

background:#334155;

min-height:70px;

}



.timer{

font-size:42px;

text-align:center;

color:#facc15;

font-weight:bold;

}



.question{

background:#111827;

padding:20px;

border-radius:15px;

text-align:center;

}



.correct{

background:#16a34a!important;

}


.wrong{

background:#dc2626!important;

}


.results{

background:#111827;

padding:15px;

border-radius:15px;

margin-top:15px;

}



.result-row{

display:flex;

justify-content:space-between;

padding:10px;

border-bottom:1px solid #334155;

}



@media(max-width:600px){

.answers{

grid-template-columns:1fr;

}

}


</style>

</head>


<body>


<div class="container">


<h1>
🎵 Music Battle
</h1>



<!-- ЛОББИ -->

<div id="lobby">


<input
id="nickname"
placeholder="Ваш ник"
maxlength="32"
>


<input
id="musicQuery"
placeholder="Любимый исполнитель или песня"
>


<select id="trackCount">

<option value="10">
10 песен
</option>

<option value="20">
20 песен
</option>

<option value="30">
30 песен
</option>


</select>



<button onclick="createRoom()">

🚀 Создать комнату

</button>



<hr>


<input
id="roomCodeInput"
placeholder="Код комнаты"
maxlength="6"
>



<button
class="secondary"
onclick="joinRoom()"
>

🔑 Войти

</button>



<div id="message"></div>


</div>





<!-- КОМНАТА -->


<div
id="roomScreen"
class="hidden"
>


<div
id="roomCode"
class="room-code"
></div>


<div
id="roomStatus"
class="status"
>

Ожидание игроков...

</div>



<button
id="startButton"
class="hidden"
onclick="startGame()"
>

▶️ Начать игру

</button>



<h3>
👥 Игроки
</h3>



<div id="players"></div>



</div>





<!-- ИГРА -->


<div
id="gameScreen"
class="hidden"
>



<div class="status">

Раунд

<span id="roundNumber">
1
</span>

/

<span id="totalRounds">
10
</span>

</div>



<div
class="timer"
id="timer"
>

15

</div>



<div class="question">


<h2>
🎧 Что играет?
</h2>



<button
class="secondary"
onclick="playPreview()"
>

▶️ Слушать

</button>



<audio
id="audio"
controls
style="width:100%;margin-top:10px"
></audio>



</div>



<div
id="answers"
class="answers"
></div>



<div
id="roundResults"
class="results hidden"
>

<h3>
Результат
</h3>


<div id="resultsList"></div>


</div>


</div>




</div>





<script>


// =============================
// SUPABASE
// =============================


const SUPABASE_URL =
"https://rtipoyofrixgxsozysng.supabase.co";


const SUPABASE_KEY =
"sb_publishable_um-yGCvtCrApIIfr3qrUvA_iXbsyPhb";



const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



// =============================
// STATE
// =============================


let roomId=null;

let playerId=null;

let isHost=false;

let currentRoom=null;

let currentTrack=null;

let answers=[];

let selectedAnswer=null;

let timer=null;

let timeLeft=15;

let channel=null;




// =============================
// HELPERS
// =============================


function $(id){

return document.getElementById(id);

}



function msg(text,error=false){

$("message").innerHTML=

`<div style="color:${error?"#f87171":"#4ade80"}">
${text}
</div>`;

}



function code(){

let chars=
"ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

let r="";


for(let i=0;i<6;i++){

r+=chars[
Math.floor(
Math.random()*chars.length
)
];

}


return r;

}




function shuffle(arr){

return [...arr].sort(
()=>Math.random()-0.5
);

}


// =============================
// MUSIC SEARCH (iTunes + Deezer)
// =============================


async function musicSearch(query){


const res =
await fetch(

"https://rtipoyofrixgxsozysng.supabase.co/functions/v1/music-search",

{

method:"POST",

headers:{

"Content-Type":"application/json",

"apikey":SUPABASE_KEY

},

body:JSON.stringify({

query:query

})

}

);



if(!res.ok){

throw new Error(
"Ошибка поиска музыки"
);

}



return await res.json();


}




// =============================
// CREATE ROOM
// =============================


async function createRoom(){


const nickname =
$("nickname").value.trim();


const query =
$("musicQuery").value.trim();


const count =
Number(
$("trackCount").value
);



if(!nickname){

msg(
"Введите ник",
true
);

return;

}



if(!query){

msg(
"Введите исполнителя или песню",
true
);

return;

}



// создаём комнату


const roomCode =
code();



const {data,error}=

await supabaseClient
.from("game_rooms")
.insert({

room_code:roomCode,

track_count:count,

total_rounds:count,

current_round:0,

game_state:"waiting"

})

.select()
.single();



if(error){

console.error(error);

msg(
error.message,
true
);

return;

}



roomId=data.id;

currentRoom=data;



// добавляем игрока


const player =
await addPlayer(nickname);



if(!player){

return;

}



playerId=player.id;

isHost=true;



await supabaseClient

.from("game_rooms")

.update({

host_id:playerId

})

.eq(
"id",
roomId
);





// загружаем музыку


await loadMusic(query);



enterRoom(roomCode);



}




// =============================
// LOAD MUSIC
// =============================


async function loadMusic(query){



msg(
"Ищу музыку..."
);



try{


const tracks =
await musicSearch(query);



if(
!tracks ||
tracks.length===0
){

msg(
"Музыка не найдена",
true
);

return;

}



let position=1;



for(const t of tracks){


await supabaseClient

.from("room_tracks")

.insert({

room_id:roomId,

artist:t.artist,

title:t.title,

preview_url:t.preview_url,

cover:t.cover,

position:position++

});


}



msg(
"Музыка загружена"
);



}

catch(e){

console.error(e);

msg(
e.message,
true
);

}



}




// =============================
// ADD PLAYER
// =============================


async function addPlayer(name){


const {data,error}=

await supabaseClient

.from("players")

.insert({

room_id:roomId,

nickname:name,

score:0

})

.select()

.single();



if(error){

console.error(error);

msg(
error.message,
true
);

return null;

}



return data;


}




// =============================
// JOIN ROOM
// =============================


async function joinRoom(){



const nickname =
$("nickname").value.trim();



const roomCode =
$("roomCodeInput")
.value
.trim()
.toUpperCase();




if(!nickname){

msg(
"Введите ник",
true
);

return;

}




const {data,error}=

await supabaseClient

.from("game_rooms")

.select("*")

.eq(
"room_code",
roomCode
)

.maybeSingle();



if(error || !data){

msg(
"Комната не найдена",
true
);

return;

}



roomId=data.id;

currentRoom=data;



const player =
await addPlayer(nickname);



if(!player){

return;

}



playerId=player.id;



isHost =
data.host_id===playerId;



enterRoom(roomCode);



}




// =============================
// ENTER ROOM
// =============================


function enterRoom(roomCode){


$("lobby")
.classList
.add("hidden");



$("roomScreen")
.classList
.remove("hidden");



$("roomCode")
.textContent =
roomCode;



if(isHost){

$("startButton")
.classList
.remove("hidden");

}



loadPlayers();

subscribe();



}




// =============================
// REALTIME
// =============================


function subscribe(){



if(channel){

supabaseClient
.removeChannel(channel);

}



channel=

supabaseClient

.channel(
"room-"+roomId
)



.on(

"postgres_changes",

{

event:"*",

schema:"public",

table:"players",

filter:
"room_id=eq."+roomId

},

()=>{

loadPlayers();

}

)



.on(

"postgres_changes",

{

event:"*",

schema:"public",

table:"game_rooms",

filter:
"id=eq."+roomId

},

payload=>{


if(payload.new){

currentRoom =
payload.new;


handleRoom(
payload.new
);

}


}

)


.subscribe();


}




// =============================
// PLAYERS
// =============================


async function loadPlayers(){


const {data}=

await supabaseClient

.from("players")

.select("*")

.eq(
"room_id",
roomId
)

.order(
"score",
{
ascending:false
}

);



if(!data)return;



$("players").innerHTML=

data.map(
(p)=>

`

<div class="player">

<span>

👤 ${p.nickname}

</span>


<span class="score">

${p.score}

</span>


</div>

`

).join("");



}





// =============================
// START GAME
// =============================


async function startGame(){



if(!isHost)return;



const {data:tracks}=

await supabaseClient

.from("room_tracks")

.select("*")

.eq(
"room_id",
roomId
);



if(!tracks || tracks.length===0){

msg(
"Нет музыки",
true
);

return;

}



await supabaseClient

.from("game_rooms")

.update({

current_round:1,

total_rounds:
tracks.length,

game_state:"playing"

})

.eq(
"id",
roomId
);



}

  // =============================
// ROOM UPDATE
// =============================


function handleRoom(room){


$("roomStatus")
.textContent =
room.game_state;



if(
room.game_state==="playing"
){


$("roomScreen")
.classList
.add("hidden");



$("gameScreen")
.classList
.remove("hidden");



loadRound();


}



}





// =============================
// LOAD ROUND
// =============================


async function loadRound(){


const {data:room}=

await supabaseClient

.from("game_rooms")

.select("*")

.eq(
"id",
roomId
)

.single();



if(!room)return;



currentRoom=room;



$("roundNumber")
.textContent =
room.current_round;



$("totalRounds")
.textContent =
room.total_rounds;





const {data:tracks}=

await supabaseClient

.from("room_tracks")

.select("*")

.eq(
"room_id",
roomId
)

.order(
"position"
);



const track =

tracks[
room.current_round-1
];



if(!track)return;



currentTrack=track;



createAnswers(
tracks,
track
);



startTimer();



}





// =============================
// ANSWERS
// =============================


function createAnswers(
tracks,
correct
){



let others =

tracks.filter(
x=>
x.id!==correct.id
);



answers =

shuffle(
[
correct,
...shuffle(others).slice(0,3)
]
);



$("answers").innerHTML="";



answers.forEach(
(t,i)=>{


let b =
document.createElement("button");



b.className="answer";



b.textContent =

`${String.fromCharCode(65+i)}. ${t.artist} — ${t.title}`;



b.onclick=()=>{

answer(t);

};



$("answers")
.appendChild(b);



}

);



if(
correct.preview_url
){


$("audio").src =
correct.preview_url;


}



}




// =============================
// TIMER
// =============================


function startTimer(){



clearInterval(timer);



timeLeft=15;



$("timer")
.textContent=timeLeft;



timer=

setInterval(()=>{


timeLeft--;


$("timer")
.textContent=timeLeft;



if(timeLeft<=0){


clearInterval(timer);


answer(null);



}


},1000);



}




// =============================
// AUDIO
// =============================


function playPreview(){



$("audio")
.play()
.catch(
console.error
);



}




// =============================
// ANSWER CHECK
// =============================


async function answer(track){



if(selectedAnswer)return;



selectedAnswer=true;



clearInterval(timer);



let correct=false;

let points=0;



if(
track &&
track.id===currentTrack.id
){


correct=true;


points=
Math.max(
20,
Math.round(
100*(timeLeft/15)
)
);



}




await supabaseClient

.from("answers")

.insert({

room_id:roomId,

player_id:playerId,

round_number:
currentRoom.current_round,

answer:
track?.title || null,

correct:correct,

points:points

});





if(correct){



const {data:p}=

await supabaseClient

.from("players")

.select("score")

.eq(
"id",
playerId
)

.single();



await supabaseClient

.from("players")

.update({

score:
p.score+points

})

.eq(
"id",
playerId
);



}





showResult(
correct,
points
);



setTimeout(

nextRound,

3000

);



}





// =============================
// RESULT
// =============================


function showResult(
correct,
points
){



$("roundResults")
.classList
.remove("hidden");



$("resultsList")
.innerHTML=

`

<div class="result-row">

<span>
Ответ:
</span>


<b>
${currentTrack.artist}
-
${currentTrack.title}
</b>


</div>


<div class="result-row">

<span>
Ваш результат:
</span>


<b>

${
correct
?
"✅ +"+points
:
"❌ 0"
}

</b>


</div>

`;





}





// =============================
// NEXT ROUND
// =============================


async function nextRound(){



if(!isHost)return;



const next =

currentRoom.current_round+1;



if(
next >
currentRoom.total_rounds
){



await supabaseClient

.from("game_rooms")

.update({

game_state:"finished"

})

.eq(
"id",
roomId
);



return;



}




selectedAnswer=false;



await supabaseClient

.from("game_rooms")

.update({

current_round:next

})

.eq(
"id",
roomId
);



}




// =============================
// FINISH
// =============================


async function showFinish(){



const {data}=

await supabaseClient

.from("players")

.select("*")

.eq(
"room_id",
roomId
)

.order(
"score",
{
ascending:false
}
);



$("gameScreen")
.innerHTML=

`

<h2>
🏆 Победитель
</h2>


<h1>

${data[0].nickname}

</h1>


<h2>

${data[0].score} очков

</h2>


<hr>


${
data.map(
(p)=>

`

<div class="result-row">

<span>
${p.nickname}
</span>

<b>
${p.score}
</b>

</div>

`

).join("")
}



`;



}





console.log(
"Music Battle loaded"
);

console.log(
"iTunes + Deezer mode"
);

  </script>
</body>
</html>
