<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music Battle</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;
    background:#111827;
    color:white;
    font-family:
    Arial,
    "Segoe UI",
    sans-serif;

}


.container{

    max-width:500px;
    margin:40px auto;
    background:#1f2937;
    padding:25px;
    border-radius:20px;

}


h1{

    text-align:center;
    color:#38bdf8;

}


input,select,button{


    width:100%;
    padding:14px;
    margin:8px 0;

    border-radius:12px;
    border:0;

    font-size:16px;

}


button{

    background:#22c55e;
    color:white;

    cursor:pointer;

}


button:hover{

    opacity:.8;

}


hr{

    margin:25px 0;

}


.room{

    text-align:center;
    color:#38bdf8;

}


.player{

    background:#374151;

    margin-top:10px;

    padding:12px;

    border-radius:12px;

}


.score{

    color:#facc15;

}


.error{

    color:#f87171;

}



</style>


</head>


<body>



<div class="container">


<h1>🎵 Music Battle</h1>


<input 
id="nickname"
placeholder="Введите ваш ник">


<input 
id="vk"
placeholder="Ссылка на VK профиль">


<select id="tracks">

<option value="10">
10 песен
</option>

<option value="20">
20 песен
</option>

<option value="50">
50 песен
</option>


</select>



<button onclick="createRoom()">

🚀 Создать комнату

</button>



<hr>


<input
id="roomCode"
maxlength="6"
placeholder="Код комнаты">


<button onclick="joinRoom()">

🔑 Войти в комнату

</button>



<h2 class="room" id="room"></h2>


<div id="message"></div>


<h3>
👥 Игроки
</h3>


<div id="players"></div>


</div>







<script>


// ===============================
// SUPABASE
// ===============================


const SUPABASE_URL =
"https://rtipoyofrixgxsozysng.supabase.co";


const SUPABASE_KEY =
"sb_publishable_um-yGCvtCrApIIfr3qrUvA_iXbsyPhb";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);




// ===============================


let roomId=null;

let playerId=null;




// ===============================
// CODE
// ===============================


function generateCode(){


let chars =
"ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


let code="";


for(let i=0;i<6;i++){


code += chars[
Math.floor(Math.random()*chars.length)
];


}


return code;


}





// ===============================
// CREATE ROOM
// ===============================


async function createRoom(){



let nick =
document.getElementById("nickname").value.trim();


let vk =
document.getElementById("vk").value.trim();


let count =
Number(
document.getElementById("tracks").value
);



if(!nick){

showMessage(
"Введите ник",
true
);

return;

}



let code =
generateCode();



let {data,error}=await supabaseClient

.from("game_rooms")

.insert({

room_code:code,

vk_profile:vk,

track_count:count,

status:"waiting"

})

.select()

.single();




if(error){

console.log(error);

showMessage(
error.message,
true
);

return;

}



roomId=data.id;


await addPlayer(nick);



document.getElementById("room").innerHTML =
"🔑 Комната: "+code;



startRealtime();



}







// ===============================
// JOIN
// ===============================



async function joinRoom(){



let code =
document.getElementById("roomCode").value
.trim()
.toUpperCase();



let nick =
document.getElementById("nickname").value.trim();




if(!nick || !code){

showMessage(
"Заполни поля",
true
);

return;

}





let {data,error}=await supabaseClient

.from("game_rooms")

.select("*")

.eq(
"room_code",
code
)

.maybeSingle();




if(error){

console.log(error);

showMessage(
"Ошибка поиска комнаты",
true
);

return;

}



if(!data){

showMessage(
"Комната не найдена",
true
);

return;

}



roomId=data.id;



await addPlayer(nick);



document.getElementById("room").innerHTML =
"🔑 Комната: "+code;



startRealtime();



}








// ===============================
// ADD PLAYER
// ===============================


async function addPlayer(nick){



let {data,error}=await supabaseClient

.from("players")

.insert({

room_id:roomId,

nickname:nick,

score:0

})

.select()

.single();



if(error){

console.log(error);

return;

}



playerId=data.id;



}








// ===============================
// REALTIME
// ===============================


function startRealtime(){


loadPlayers();



supabaseClient

.channel(
"room-"+roomId
)


.on(

"postgres_changes",

{

event:"*",

schema:"public",

table:"players",

filter:
"room_id=eq."+roomId

},


()=>{

loadPlayers();

}


)


.subscribe();



}







async function loadPlayers(){



let {data,error}=await supabaseClient

.from("players")

.select("*")

.eq(
"room_id",
roomId
)

.order(
"score",
{
ascending:false
}
);



if(!data)return;



let html="";



data.forEach(p=>{


html += `

<div class="player">

👤 ${p.nickname}

<br>

<span class="score">

🏆 ${p.score} очков

</span>

</div>


`;


});



document.getElementById("players")
.innerHTML=html;



}







function showMessage(text,error=false){


document.getElementById("message").innerHTML=

`
<p class="${error?'error':''}">
${text}
</p>
`;



}



</script>


</body>
</html>
