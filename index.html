<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music Battle</title>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

background:
radial-gradient(
circle at top,
#243b55,
#080d16
);

color:white;

font-family:
Arial,
sans-serif;

}



.container{

width:min(600px,94%);

margin:30px auto;

padding:25px;

background:
rgba(25,34,50,.96);

border-radius:22px;

box-shadow:
0 20px 60px rgba(0,0,0,.4);

}



h1{

text-align:center;

color:#38bdf8;

}



input,
button{

width:100%;

padding:14px;

margin:7px 0;

border:0;

border-radius:12px;

font-size:16px;

}



input{

background:#111827;

color:white;

}



button{

background:#22c55e;

color:white;

font-weight:bold;

cursor:pointer;

}



button:hover{

filter:brightness(1.1);

}



.secondary{

background:#334155;

}



.hidden{

display:none!important;

}



.room-code{

text-align:center;

font-size:32px;

color:#38bdf8;

letter-spacing:5px;

}



.player{

padding:12px;

background:#273449;

border-radius:12px;

margin:6px 0;

}



.track{

padding:12px;

background:#111827;

border-radius:12px;

margin:6px 0;

}



.answer{

background:#334155;

}



.correct{

background:#16a34a!important;

}



.wrong{

background:#dc2626!important;

}



.timer{

text-align:center;

font-size:45px;

color:#facc15;

}



</style>


</head>



<body>


<div class="container">


<h1>
🎵 Music Battle
</h1>



<!-- ЛОББИ -->

<div id="lobby">


<input
id="nickname"
placeholder="Ваш ник"
/>



<input
id="vkProfile"
placeholder="Ссылка VK профиля"
/>



<button onclick="loadMusic()">

🎵 Загрузить музыку

</button>



<div id="musicStatus"></div>



<button onclick="createRoom()">

🚀 Создать комнату

</button>



<hr>



<input
id="roomCodeInput"
placeholder="Код комнаты"
/>



<button class="secondary" onclick="joinRoom()">

🔑 Войти в комнату

</button>


<div id="message"></div>


</div>





<!-- КОМНАТА -->


<div id="roomScreen" class="hidden">


<div
id="roomCode"
class="room-code">
</div>



<h3>
👥 Игроки
</h3>


<div id="players"></div>



<button
id="startBtn"
onclick="startGame()">

▶ Начать игру

</button>


</div>





<!-- ИГРА -->


<div id="gameScreen" class="hidden">


<div class="timer" id="timer">
15
</div>



<h2 id="question">

🎧 Какая это песня?

</h2>



<button
class="secondary"
onclick="playMusic()">

▶ Слушать

</button>



<audio
id="audio"
controls
style="width:100%">
</audio>



<div id="answers"></div>


</div>


</div>



<script> 

  // ===============================
// SUPABASE
// ===============================


const SUPABASE_URL =
"https://rtipoyofrixgxsozysng.supabase.co";


const SUPABASE_KEY =
"sb_publishable_um-yGCvtCrApIIfr3qrUvA_iXbsyPhb";



const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



// ===============================
// STATE
// ===============================


let tracks = [];

let roomId = null;

let playerId = null;

let roomCode = null;

let isHost = false;

let currentTrack = null;

let timer = null;

let timeLeft = 15;



// ===============================
// HELPERS
// ===============================


function $(id){

return document.getElementById(id);

}



function message(text){

$("message").innerHTML =
text;

}



function randomCode(){

let chars =
"ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


let result="";


for(let i=0;i<6;i++){

result +=
chars[
Math.floor(
Math.random()*chars.length
)
];

}


return result;

}




// ===============================
// SPOTIFY SEARCH
// ===============================


async function spotifySearch(query){


const response =
await fetch(

SUPABASE_URL+
"/functions/v1/spotify-search",

{

method:"POST",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY

},

body:JSON.stringify({

query:query

})

}

);



return await response.json();


}





// ===============================
// ЗАГРУЗКА МУЗЫКИ
// ===============================


async function loadMusic(){


const vk =
$("vkProfile")
.value
.trim();



if(!vk){

$("musicStatus").innerHTML =
"❌ Введите VK ссылку";

return;

}



$("musicStatus").innerHTML =
"⏳ Ищем песни...";



// ВРЕМЕННО
// сюда позже подключим VK API


const vkSongs = [

"Miyagi I Got Love",

"Eminem Lose Yourself",

"Rauf Faik Детство",

"Imagine Dragons Believer",

"The Weeknd Blinding Lights"

];



tracks=[];



for(
const song of vkSongs
){


const result =
await spotifySearch(song);



if(
Array.isArray(result)
&&
result.length>0
){


tracks.push(
result[0]
);


}


}



$("musicStatus").innerHTML =

"✅ Найдено песен: "
+
tracks.length;



}




// ===============================
// СОЗДАНИЕ КОМНАТЫ
// ===============================


async function createRoom(){


const nickname =
$("nickname")
.value
.trim();



if(!nickname){

message(
"Введите ник"
);

return;

}



if(tracks.length===0){

message(
"Сначала загрузите музыку"
);

return;

}




roomCode =
randomCode();





const {data,error}=

await supabaseClient
.from("game_rooms")
.insert({

room_code:
roomCode,

total_rounds:
tracks.length,

current_round:
0,

game_state:
"waiting"

})
.select()
.single();





if(error){

message(
error.message
);

return;

}



roomId =
data.id;




const player =

await supabaseClient
.from("players")
.insert({

room_id:
roomId,

nickname:
nickname,

score:
0

})
.select()
.single();




playerId =
player.data.id;



isHost=true;




await supabaseClient
.from("game_rooms")
.update({

host_id:
playerId

})
.eq(
"id",
roomId
);





// сохраняем треки


for(
let i=0;
i<tracks.length;
i++
){


await supabaseClient
.from("room_tracks")
.insert({

room_id:
roomId,

artist:
tracks[i].artist,

title:
tracks[i].title,

preview_url:
tracks[i].preview_url,

cover:
tracks[i].cover,

position:
i+1

});


}




enterRoom();

}

  // ===============================
// ВХОД В КОМНАТУ
// ===============================


function enterRoom(){


$("lobby")
.classList
.add("hidden");


$("roomScreen")
.classList
.remove("hidden");



$("roomCode")
innerHTML =
roomCode;



loadPlayers();


subscribeRoom();


}





// ===============================
// ПОДКЛЮЧЕНИЕ REALTIME
// ===============================


function subscribeRoom(){


supabaseClient

.channel(
"room-"+roomId
)


.on(
"postgres_changes",

{
event:"*",
schema:"public",
table:"players",
filter:
"room_id=eq."+roomId
},

()=>{

loadPlayers();

}

)


.on(
"postgres_changes",

{
event:"UPDATE",
schema:"public",
table:"game_rooms",
filter:
"id=eq."+roomId
},

(data)=>{


if(
data.new.game_state==="playing"
){

$("roomScreen")
.classList
.add("hidden");


$("gameScreen")
.classList
.remove("hidden");


loadRound();


}



}

)


.subscribe();



}





// ===============================
// ИГРОКИ
// ===============================


async function loadPlayers(){


const {data}=

await supabaseClient

.from("players")

.select("*")

.eq(
"room_id",
roomId
);



let html="";



data.forEach(p=>{


html+=`

<div class="player">

👤 ${p.nickname}

<br>

⭐ ${p.score}

</div>

`;


});



$("players")
.innerHTML =
html;



}





// ===============================
// ВХОД В КОМНАТУ ПО КОДУ
// ===============================


async function joinRoom(){


const nickname =
$("nickname")
.value
.trim();


const code =
$("roomCodeInput")
.value
.trim()
.toUpperCase();



const {data:room}=

await supabaseClient

.from("game_rooms")

.select("*")

.eq(
"room_code",
code
)

.single();



if(!room){

message(
"Комната не найдена"
);

return;

}



roomId =
room.id;


roomCode =
code;




const {data:player}=

await supabaseClient

.from("players")

.insert({

room_id:
roomId,

nickname:
nickname,

score:
0

})

.select()
.single();



playerId =
player.id;


enterRoom();


}





// ===============================
// СТАРТ ИГРЫ
// ===============================


async function startGame(){


if(!isHost)
return;



await supabaseClient

.from("game_rooms")

.update({

current_round:
1,

game_state:
"playing"

})

.eq(
"id",
roomId
);



}





// ===============================
// ЗАГРУЗКА РАУНДА
// ===============================


async function loadRound(){


const {data:room}=

await supabaseClient

.from("game_rooms")

.select("*")

.eq(
"id",
roomId
)

.single();



const round =
room.current_round;



const {data:list}=

await supabaseClient

.from("room_tracks")

.select("*")

.eq(
"room_id",
roomId
)

.order(
"position"
);



currentTrack =
list[
round-1
];



buildAnswers(
list,
currentTrack
);



startTimer();



}




// ===============================
// СОЗДАНИЕ ОТВЕТОВ
// ===============================


function buildAnswers(
list,
correct
){


let variants =

list
.filter(
x=>x.id!==correct.id
)

.sort(
()=>Math.random()-0.5
)

.slice(0,3);



variants.push(correct);



variants.sort(
()=>Math.random()-0.5
);



$("answers")
.innerHTML="";



variants.forEach(track=>{


let btn =
document.createElement(
"button"
);



btn.className =
"answer";



btn.innerHTML =

track.artist+
" — "+
track.title;



btn.onclick=()=>{

answer(track);

};



$("answers")
.appendChild(btn);



});



if(
currentTrack.preview_url
){

$("audio").src =
currentTrack.preview_url;

}



}

  // ===============================
// ТАЙМЕР
// ===============================


function startTimer(){


clearInterval(timer);



timeLeft=15;


$("timer")
.innerHTML=timeLeft;



timer=setInterval(()=>{


timeLeft--;


$("timer")
.innerHTML=timeLeft;



if(timeLeft<=0){


clearInterval(timer);


answer(null);


}



},1000);



}




// ===============================
// ПРОСЛУШИВАНИЕ
// ===============================


function playMusic(){


$("audio")
.play()
.catch(
console.error
);


}





// ===============================
// ОТВЕТ ИГРОКА
// ===============================


async function answer(track){



clearInterval(timer);



let correct=false;


let points=0;



if(
track &&
track.id===currentTrack.id
){


correct=true;


points =
Math.max(
20,
Math.floor(
100*(timeLeft/15)
)
);


}




await supabaseClient

.from("answers")

.insert({

room_id:
roomId,

player_id:
playerId,

round_number:
currentTrack.position,

answer:
track ?
track.title :
null,

correct:
correct,

points:
points

});





if(correct){


const {data:p}=

await supabaseClient

.from("players")

.select("score")

.eq(
"id",
playerId
)

.single();




await supabaseClient

.from("players")

.update({

score:
p.score+points

})

.eq(
"id",
playerId
);



}



showResult(
correct,
points
);



setTimeout(
nextRound,
3000
);



}





// ===============================
// РЕЗУЛЬТАТ
// ===============================


function showResult(
correct,
points
){


if(correct){


$("question")
.innerHTML =

"✅ Правильно! +"+
points;



}else{


$("question")
.innerHTML =

"❌ Неправильно<br>"+
currentTrack.artist+
" — "+
currentTrack.title;



}



}




// ===============================
// СЛЕДУЮЩИЙ РАУНД
// ===============================


async function nextRound(){


if(!isHost)
return;



const {data:room}=

await supabaseClient

.from("game_rooms")

.select("*")

.eq(
"id",
roomId
)

.single();




if(
room.current_round >=
room.total_rounds
){


await supabaseClient

.from("game_rooms")

.update({

game_state:
"finished"

})

.eq(
"id",
roomId
);



finishGame();



return;

}




await supabaseClient

.from("game_rooms")

.update({

current_round:
room.current_round+1

})

.eq(
"id",
roomId
);



loadRound();



}





// ===============================
// КОНЕЦ ИГРЫ
// ===============================


async function finishGame(){


const {data}=

await supabaseClient

.from("players")

.select("*")

.eq(
"room_id",
roomId
)

.order(
"score",
{
ascending:false
}
);



$("gameScreen")
.innerHTML = `

<h2>
🏆 Игра окончена
</h2>


<h3>

Победитель:

${data[0]?.nickname}

</h3>


${

data.map(p=>`

<div class="player">

${p.nickname}

⭐ ${p.score}

</div>

`).join("")

}



`;



}



// ===============================
// ЗАПУСК
// ===============================


console.log(
"🎵 Music Battle loaded"
);


</script>


</body>

</html>
